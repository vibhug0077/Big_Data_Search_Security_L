name: Validate public workbooks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate public practical structure
        run: python scripts/validate_public_workbooks.py
      - name: Scan for secrets
        run: python scripts/scan_secrets.py
